name: Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'   # kurları yenilemek için yayını periyodik tekrarlar
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # push'ta önce tüm testler; geçmezse yayınlanmaz.
  # 4.36: zamanlanmış kur yenilemesi testleri yeniden çalıştırmaz ama yalnızca testleri GEÇMİŞ son sürümü yayınlar
  # (önceden main'in ucunu testsiz yayınlıyordu: 4.28'de kırık sürüm böyle çıktı).
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: bash tests/run.sh
  deploy:
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - name: Testleri geçmiş son sürümü bul (yalnız zamanlanmış çalışmada)
        id: ref
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          for id in $(gh api "repos/$R/actions/workflows/pages.yml/runs?event=push&branch=main&per_page=20" -q '.workflow_runs[].id'); do
            ok=$(gh api "repos/$R/actions/runs/$id/jobs" -q '.jobs[] | select(.name=="test") | .conclusion')
            if [ "$ok" = "success" ]; then
              sha=$(gh api "repos/$R/actions/runs/$id" -q .head_sha)
              echo "Testleri geçmiş sürüm: $sha (çalışma $id)"
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Testleri geçmiş bir sürüm bulunamadı; yayın yapılmadı."
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha || github.sha }}
      - name: Kurları indir (başarısız olursa eski rates.json kalır)
        continue-on-error: true
        run: |
          set -x
          curl -fsS --http1.1 --retry 5 --retry-all-errors --retry-delay 3 --max-time 40 -A "Mozilla/5.0 (compatible; WalletPWA)" -H "Accept: application/json" https://finans.truncgil.com/v4/today.json -o "$RUNNER_TEMP/raw.json"
          python3 - <<'PY'
          import json, os
          txt = open(os.path.join(os.environ["RUNNER_TEMP"], "raw.json"), encoding="utf-8", errors="replace").read()
          print("BOYUT:", len(txt))
          def parse(t):
              for cand in (t, t.rstrip() + "}", t[:t.rfind("},\"") + 1] + "}"):
                  try:
                      return json.loads(cand)
                  except json.JSONDecodeError:
                      pass
              raise ValueError("JSON onarilamadi")
          j = parse(txt)
          items = {k: v for k, v in j.items() if isinstance(v, dict)}
          if items:
              out = {"updated": str(j.get("Update_Date", "")), "items": items}
              json.dump(out, open("rates.json", "w", encoding="utf-8"), ensure_ascii=False)
              print("rates.json:", len(items), "kalem")
              print("ANAHTARLAR:", ", ".join(list(items.keys())[:80]))
          else:
              print("UYARI: nesne bulunamadi; ust anahtarlar:", list(j.keys())[:20])
          PY
      - name: Borsa İstanbul hisse listesini yenile (başarısız olursa depodaki bist.json kalır)
        continue-on-error: true
        run: python3 tools/bist_list.py bist.json
      - name: Kaynak denetimi
        run: python3 tools/build.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: dep
        uses: actions/deploy-pages@v4
