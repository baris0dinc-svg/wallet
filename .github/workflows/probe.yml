name: Veri kaynağı denemesi
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Liste
        shell: bash {0}
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Mobile Safari/537.36"
          curl -sS -m 40 -A "$UA" -o /tmp/b "https://www.isyatirim.com.tr/tr-tr/analiz/hisse/Sayfalar/Temel-Degerler-Ve-Oranlar.aspx"
          grep -n -m3 'hisse=THYAO' /tmp/b | cut -c1-400
          L=$(grep -n -m1 'hisse=THYAO' /tmp/b | cut -d: -f1); sed -n "$((L-3)),$((L+12))p" /tmp/b | cut -c1-300
          python3 - <<'PY'
          import re,json
          s=open('/tmp/b',encoding='utf-8',errors='replace').read()
          rows=re.findall(r'<tr[^>]*>(.*?)</tr>',s,re.S)
          out={}
          for r in rows:
            m=re.search(r'hisse=([A-Z0-9]{3,6})',r)
            if not m: continue
            cells=[re.sub(r'<[^>]+>','',c).strip() for c in re.findall(r'<td[^>]*>(.*?)</td>',r,re.S)]
            out.setdefault(m.group(1),cells[:4])
          print(len(out)); print(json.dumps(dict(list(out.items())[:8]),ensure_ascii=False))
          open('/tmp/bist.json','w').write(json.dumps(out,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with: { name: bist, path: /tmp/bist.json }
