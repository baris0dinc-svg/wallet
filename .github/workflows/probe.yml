name: Veri kaynağı denemesi
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Liste
        run: |
          python3 tools/bist_list.py /tmp/bist.json
          echo "B64START"; gzip -9c /tmp/bist.json | base64 -w0; echo; echo "B64END"
