name: APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Kişisel imza anahtarı (sır tanımlıysa)
        env:
          KS: ${{ secrets.WALLET_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/wallet.jks"
            echo "WALLET_KEYSTORE=$RUNNER_TEMP/wallet.jks" >> "$GITHUB_ENV"
          fi
      - name: APK derle
        env:
          WALLET_KEYSTORE_PASS: ${{ secrets.WALLET_KEYSTORE_PASS }}
        run: gradle -p android-app assembleDebug --no-daemon --stacktrace
      - name: Release'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Wallet.apk
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest Wallet.apk --title "Wallet (Android APK)" --notes "Telefona indirip kurun. Güncel sürüm bu sayfadaki Wallet.apk dosyasıdır."
