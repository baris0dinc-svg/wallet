plugins { id 'com.android.application' }

android {
    namespace 'app.wallet'
    compileSdk 34
    defaultConfig {
        applicationId 'app.wallet.personal'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        // Kişisel kullanım için sabit imza: güncellemeler eski sürümün üstüne kurulabilsin diye.
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
}
