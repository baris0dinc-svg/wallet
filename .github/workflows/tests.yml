name: Testler
# main dışındaki dallarda ve elle; main'de aynı testler pages.yml içinde yayından önce çalışır.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: bash tests/run.sh
