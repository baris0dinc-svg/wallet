name: Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'   # kurları yenilemek için yayını periyodik tekrarlar
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Kurları indir (başarısız olursa eski rates.json kalır)
        continue-on-error: true
        run: |
          curl -fsS --retry 3 --max-time 30 https://finans.truncgil.com/v4/today.json -o "$RUNNER_TEMP/raw.json"
          python3 - <<'PY'
          import json, os
          j = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "raw.json"), encoding="utf-8"))
          items = {k: v for k, v in j.items() if isinstance(v, dict)}
          if items:
              out = {"updated": str(j.get("Update_Date", "")), "items": items}
              json.dump(out, open("rates.json", "w", encoding="utf-8"), ensure_ascii=False)
              print("rates.json:", len(items), "kalem")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: dep
        uses: actions/deploy-pages@v4
