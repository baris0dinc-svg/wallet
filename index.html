<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wallet</title>
<meta name="theme-color" content="#0E6B58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wallet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" aria-hidden="true"><span class="logo"></span><b>Wallet</b></div>
<script>try{if(sessionStorage.getItem('wallet-splash')){document.getElementById('splash').remove();}else{sessionStorage.setItem('wallet-splash','1');}}catch(e){}</script>
<div class="wrap">
  <header id="hdr"></header>
  <main id="view" class="stack"></main>
</div>
<button class="fab" id="fab" data-act="new-tx" aria-label="İşlem ekle"></button>
<div id="sheet-root"></div>
<div class="lock" id="lock" hidden></div>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});</script>
</body>
</html>
